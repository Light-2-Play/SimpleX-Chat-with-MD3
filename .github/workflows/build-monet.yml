name: Build SimpleX Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      # Скачиваем официальные APK и распаковываем библиотеки
      - name: Extract prebuilt Haskell core from official APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apk_extract
          cd /tmp/apk_extract
          
          # Скачиваем все APK из релиза
          gh release download --repo simplex-chat/simplex-chat --pattern "*.apk" --clobber
          
          # Распаковываем библиотеки
          for apk in *.apk; do
            echo "Распаковка библиотек из $apk..."
            unzip -qo "$apk" "lib/*"
          done
          
          # Копируем библиотеки в проект
          mkdir -p $GITHUB_WORKSPACE/apps/multiplatform/android/src/main/jniLibs
          cp -r lib/* $GITHUB_WORKSPACE/apps/multiplatform/android/src/main/jniLibs/
          
          # Удаляем дубликат libapp-lib.so (его заново собрал CMake)
          find $GITHUB_WORKSPACE/apps/multiplatform/android/src/main/jniLibs -name "libapp-lib.so" -delete
          
          mkdir -p $GITHUB_WORKSPACE/apps/multiplatform/common/src/commonMain/cpp/android/libs
          cp -r lib/* $GITHUB_WORKSPACE/apps/multiplatform/common/src/commonMain/cpp/android/libs/

      - name: Make gradlew executable
        run: chmod +x apps/multiplatform/gradlew

      - name: Build ByeByeDPI (romanvht) for arm64
        run: |
          export GIT_TERMINAL_PROMPT=0
          git clone --depth 1 --recurse-submodules https://github.com/romanvht/ByeByeDPI.git byedpi-src

          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CLANG="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

          # Переходим в папку ядра
          cd byedpi-src/app/src/main/cpp/byedpi

          # Удаляем файл службы Windows, чтобы Clang его не компилировал
          rm -f win_service.c

          # Компилируем нативный бинарник под arm64
          $CLANG -O2 -fPIE -pie -D_DEFAULT_SOURCE -o libciadpi.so *.c

          # Переносим скомпилированную библиотеку в проект SimpleX
          cd "$GITHUB_WORKSPACE"
          mkdir -p apps/multiplatform/android/src/main/jniLibs/arm64-v8a
          cp byedpi-src/app/src/main/cpp/byedpi/libciadpi.so apps/multiplatform/android/src/main/jniLibs/arm64-v8a/libciadpi.so
          rm -rf byedpi-src
          
      - name: Build Debug APK
        run: |
          cd apps/multiplatform
          ./gradlew assembleFossDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simplex-chat-monet-apk
          path: apps/multiplatform/android/build/outputs/apk/**/*.apk
