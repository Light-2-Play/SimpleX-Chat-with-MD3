name: Build SimpleX Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Автоматически принимаем лицензии предустановленного Android SDK
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      # Скачиваем официальный APK и распаковываем Haskell core
      - name: Extract prebuilt Haskell core from official APK
        run: |
          mkdir -p /tmp/apk_extract
          cd /tmp/apk_extract
          
          APK_URL=$(curl -s https://api.github.com/repos/simplex-chat/simplex-chat/releases/latest \
            | grep -o 'https://[^" ]*simplex-chat-[^" ]*\.apk' \
            | head -n 1)
          
          echo "Downloading APK from: $APK_URL"
          curl -L "$APK_URL" -o official.apk
          
          unzip -q official.apk "lib/*"
          
          mkdir -p $GITHUB_WORKSPACE/apps/multiplatform/android/src/main/jniLibs
          cp -r lib/* $GITHUB_WORKSPACE/apps/multiplatform/android/src/main/jniLibs/
          
          mkdir -p $GITHUB_WORKSPACE/apps/multiplatform/common/src/commonMain/cpp/android/libs
          cp -r lib/* $GITHUB_WORKSPACE/apps/multiplatform/common/src/commonMain/cpp/android/libs/

      - name: Make gradlew executable
        run: chmod +x apps/multiplatform/gradlew

      - name: Build Debug APK
        run: |
          cd apps/multiplatform
          ./gradlew assembleFossDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simplex-chat-monet-apk
          path: apps/multiplatform/android/build/outputs/apk/**/*.apk
